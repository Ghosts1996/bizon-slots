name: scn-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          script: |
            cd /opt/video
            python3 - <<'PY' > fix.txt 2>&1
            import json
            S = 396000  # 6:36 пропущено в начале видео
            d = json.load(open("scn.json"))
            items = d["data"]
            print("POST0", json.dumps([i for i in items if i["action"] == "post"][0], ensure_ascii=False)[:300])
            out, early, dropped = [], [], []
            for it in items:
                it = json.loads(json.dumps(it))
                msg = str(it.get("message") or "").strip()
                if it["action"] == "post" and msg in ("Нет звука", "Есть!"):
                    dropped.append(it["timeshift"]); continue
                if it["action"] == "goOnline":
                    out.append(it); continue
                t = it["timeshift"] - S
                if t < 3000:
                    early.append(it)
                else:
                    it["timeshift"] = t
                    out.append(it)
            # приветствия, которые шли во время заставки: равномерно в первые полторы минуты
            early.sort(key=lambda x: x["timeshift"])
            for i, it in enumerate(early):
                it["timeshift"] = 3000 + i * int(90000 / max(len(early), 1))
                out.append(it)
            out.sort(key=lambda x: x["timeshift"])
            d["data"] = out
            json.dump(d, open("scn_fixed.json", "w"), ensure_ascii=False)
            fmt = lambda ms: f"{ms//60000}:{ms%60000/1000:06.3f}"
            print("DROPPED", [fmt(t) for t in dropped], "EARLY", len(early), "TOTAL", len(items), "->", len(out))
            for it in out:
                if it["action"] != "post":
                    print("CMD", it["action"], fmt(it["timeshift"]), json.dumps(it.get("data"), ensure_ascii=False)[:80])
            print("LASTPOST", fmt(max(i["timeshift"] for i in out if i["action"] == "post")))
            PY
            echo "::notice::$(tr '\n' ' ' < fix.txt | cut -c1-3000)"
      - name: fetch
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no "$USER_@$HOST:/opt/video/scn_fixed.json" scn_fixed.json
        env:
          PASS: ${{ secrets.VDS_PASSWORD }}
          USER_: ${{ secrets.VDS_USER }}
          HOST: ${{ secrets.VDS_HOST }}
      - name: publish
        run: |
          B64=$(base64 -w0 scn_fixed.json)
          SHA=$(curl -s -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/contents/out/scn_fixed.json?ref=scn-out | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha",""))' || true)
          curl -s -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/git/refs/heads/scn-out | grep -q '"ref"' || \
            curl -s -X POST -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/git/refs -d "{\"ref\":\"refs/heads/scn-out\",\"sha\":\"${{ github.sha }}\"}" >/dev/null
          printf '{"message":"scn","branch":"scn-out","content":"%s"%s}' "$B64" "${SHA:+,\"sha\":\"$SHA\"}" > body.json
          curl -s -X PUT -H "Authorization: Bearer $GH" https://api.github.com/repos/${{ github.repository }}/contents/out/scn_fixed.json -d @body.json | head -c 200
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          source: "app,requirements.txt,Dockerfile,docker-compose.yml"
          target: /opt/bizon-slots

      - name: Build and run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          command_timeout: 20m
          script: |
            err() { echo "::error::$*"; }
            trap 'err "deploy failed at line $LINENO"' ERR
            set -eE
            export DEBIAN_FRONTEND=noninteractive
            command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; }
            if ! command -v docker >/dev/null 2>&1; then
              echo "installing docker"
              curl -fsSL https://get.docker.com | sh >/tmp/docker-install.log 2>&1 || { err "docker install: $(tail -5 /tmp/docker-install.log | tr '\n' ' ')"; exit 1; }
            fi
            systemctl start docker 2>/dev/null || true
            if docker compose version >/dev/null 2>&1; then DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then DC="docker-compose"
            else apt-get install -y -qq docker-compose-plugin >/dev/null 2>&1 && DC="docker compose" || { err "no docker compose"; exit 1; }
            fi
            if ss -ltnp 2>/dev/null | grep -q ':8088 ' && ! docker ps --format '{{.Names}}' | grep -q '^bizon-slots$'; then
              err "port 8088 busy: $(ss -ltnp | grep ':8088 ')"; exit 1
            fi
            cd /opt/bizon-slots
            $DC up -d --build >/tmp/bizon-build.log 2>&1 || { err "build: $(tail -8 /tmp/bizon-build.log | tr '\n' ' ')"; exit 1; }
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1 && break; sleep 2; done
            curl -fsS http://127.0.0.1:8088/health >/dev/null || { err "not healthy: $(docker logs --tail 15 bizon-slots 2>&1 | tr '\n' ' ')"; exit 1; }
            IP=$(curl -fsS -4 https://ifconfig.me 2>/dev/null || hostname -I | cut -d' ' -f1)
            echo "::notice::OK http://$IP:8088/slots -> $(curl -fsS http://127.0.0.1:8088/slots | cut -c1-200)"

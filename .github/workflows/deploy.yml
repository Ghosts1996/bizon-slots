name: deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "deploy/**", "requirements.txt", "tests/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to VDS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          source: "app,requirements.txt,deploy"
          target: /opt/bizon-slots

      - name: Build and run
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN,TG_TOKEN,SMTP_USER,SMTP_PASS,SMTP_HOST,REPORT_TO,ALERT_TO
          command_timeout: 20m
          script: |
            err() { echo "::error::$*"; }
            trap 'err "deploy failed at line $LINENO"' ERR
            set -eE
            export DEBIAN_FRONTEND=noninteractive
            command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl; }
            if ! python3 -m venv --help >/dev/null 2>&1 || ! python3 -c "import ensurepip" 2>/dev/null; then
              apt-get update -qq >/dev/null && apt-get install -y -qq python3-venv python3-pip >/dev/null 2>&1 || { err "apt python3-venv failed"; exit 1; }
            fi
            if ss -ltnp 2>/dev/null | grep ':8088 ' | grep -qv uvicorn; then
              err "port 8088 busy: $(ss -ltnp | grep ':8088 ')"; exit 1
            fi
            cd /opt/bizon-slots
            [ -x venv/bin/pip ] || python3 -m venv venv
            venv/bin/pip install -q --upgrade pip >/tmp/bizon-pip.log 2>&1 || true
            venv/bin/pip install -q -r requirements.txt >>/tmp/bizon-pip.log 2>&1 || { err "pip: $(tail -6 /tmp/bizon-pip.log | tr '\n' ' ')"; exit 1; }
            umask 077
            {
              printf 'BIZON_TOKEN=%s\n' "$BIZON_TOKEN"
              printf 'TG_TOKEN=%s\n' "$TG_TOKEN"
              printf 'SMTP_USER=%s\nSMTP_PASS=%s\n' "$SMTP_USER" "$SMTP_PASS"
              # хост по адресу ящика: gmail / mail.ru / yandex
              H="$SMTP_HOST"
              if [ -z "$H" ]; then
                case "$SMTP_USER" in
                  *@gmail.com) H=smtp.gmail.com ;;
                  *@mail.ru|*@bk.ru|*@inbox.ru|*@list.ru) H=smtp.mail.ru ;;
                  *) H=smtp.yandex.ru ;;
                esac
              fi
              printf 'SMTP_HOST=%s\n' "$H"
              printf 'REPORT_TO=%s\nALERT_TO=%s\n' "$REPORT_TO" "$ALERT_TO"
            } > /opt/bizon-slots/.env
            umask 022
            cp deploy/bizon-report.service deploy/bizon-report.timer deploy/bizon-watchdog.service deploy/bizon-watchdog.timer deploy/bizon-tgbot.service /etc/systemd/system/
            cp deploy/bizon-slots.service /etc/systemd/system/bizon-slots.service
            systemctl daemon-reload
            systemctl enable -q bizon-slots
            systemctl restart bizon-slots
            systemctl disable -q --now bizon-tgpoll.timer 2>/dev/null || true
            systemctl enable -q --now bizon-report.timer bizon-watchdog.timer
            systemctl enable -q bizon-tgbot && systemctl restart bizon-tgbot
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1 && break; sleep 1; done
            curl -fsS http://127.0.0.1:8088/health >/dev/null || { err "not healthy: $(journalctl -u bizon-slots -n 15 --no-pager 2>&1 | tr '\n' ' ')"; exit 1; }
            if command -v ufw >/dev/null && ufw status | grep -q active; then ufw allow 8088/tcp >/dev/null; fi
            IP=$(curl -fsS -4 --max-time 5 https://ifconfig.me 2>/dev/null || hostname -I | cut -d' ' -f1)
            sqlite3 /opt/bizon-slots/data.db "delete from reg where client_id='deploytest'; delete from reg_log where client_id='deploytest';" 2>/dev/null || venv/bin/python -c "import sqlite3;c=sqlite3.connect('/opt/bizon-slots/data.db');c.execute(\"delete from reg where client_id='deploytest'\");c.execute(\"delete from reg_log where client_id='deploytest'\");c.commit()" 2>/dev/null || true
            echo "::notice::report-preview $(cd /opt/bizon-slots && set -a && . ./.env && set +a && venv/bin/python -m app.report daily --dry 2>&1 | tr '\n' '|' | cut -c1-600)"
            if grep -q '^TG_TOKEN=.' .env; then
              echo "::notice::tg-links $(set -a; . ./.env; set +a; venv/bin/python -m app.report links 2>&1 | tail -1)"
            fi
            echo "::notice::visited-test $(curl -fsS 'http://127.0.0.1:8088/visited?client_id=test&ts=1793617200')"
            echo "::notice::OK http://$IP:8088/slots -> $(curl -fsS http://127.0.0.1:8088/slots | cut -c1-200)"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

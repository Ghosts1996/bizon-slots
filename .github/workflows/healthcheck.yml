name: healthcheck

# Раз в 30 минут проверяет, что сервис отвечает. При падении GitHub сам
# присылает письмо владельцу репозитория о неудачном запуске.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            curl -fsS --max-time 15 "http://${{ secrets.VDS_HOST }}:8088/health" && exit 0
            sleep 20
          done
          echo "::error::Сервис слотов не отвечает"
          exit 1

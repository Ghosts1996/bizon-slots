name: scn-get

# Скачивает новое видео с Яндекс Диска на VDS и сопоставляет его по звуку
# со старой записью (oct.mp4): где вырезан кусок и на сколько сдвинуто.
# Результат - в ветке scn-data (align.txt).

on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          source: "tools/align.py,tools/yadisk.py,tools/refine.py"
          target: /opt/video
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          command_timeout: 50m
          envs: VIDEO_URL
          script: |
            mkdir -p /opt/video/out && cd /opt/video
            command -v ffmpeg >/dev/null || (apt-get update -qq >/dev/null && apt-get install -y -qq ffmpeg >/dev/null 2>&1)
            [ -x venv/bin/python ] || python3 -m venv venv
            venv/bin/python -c "import numpy" 2>/dev/null || venv/bin/pip install -q numpy
            exec > info.txt 2>&1
            ls -la /opt/video /opt/video/out
            python3 tools/yadisk.py "$VIDEO_URL" > vids.tsv
            echo "src.mp4 dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 src.mp4)"
            HREF=$(grep "8окт" vids.tsv | cut -f4)
            echo "== start"; venv/bin/python tools/refine.py "$HREF" 0 30 src.mp4 380 40
            echo "== cut";   venv/bin/python tools/refine.py "$HREF" 565 40 src.mp4 950 310
            echo "== end";   venv/bin/python tools/refine.py "$HREF" 3440 46 src.mp4 3820 320
            true
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
      - name: save to scn-data
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir d && cd d
          sshpass -p "$PASS" scp -o StrictHostKeyChecking=no "$USER_@$HOST:/opt/video/info.txt" info.txt
          cat info.txt | head -60
          git init -q && git checkout -q -b scn-data
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm "align $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH}@github.com/${{ github.repository }}" scn-data
        env:
          PASS: ${{ secrets.VDS_PASSWORD }}
          USER_: ${{ secrets.VDS_USER }}
          HOST: ${{ secrets.VDS_HOST }}
          GH: ${{ secrets.GITHUB_TOKEN }}

name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            cd /opt/bizon-slots
            set -a; . ./.env; set +a
            venv/bin/python - <<'PY' > /tmp/diag.txt 2>&1
            import datetime, json, traceback
            from app.main import db, MSK
            from app import report as r
            try:
                con = db(); r.acl_tables(con)
                print("USERS", [(c[-4:], role, label) for c, role, label in con.execute("select chat_id, role, label from tg_users")])
                print("REQ", con.execute("select * from tg_requests").fetchall()[-3:])
                ts = 1793710800
                print("REG", con.execute("select ts, reg_at from reg").fetchall()[-2:])
                print("SENT16", con.execute("select step from sent where ts = ?", (ts,)).fetchall())
                print("VIS16", con.execute("select client_id, visited, minutes, segment from visits where ts = ?", (ts,)).fetchall())
                st = datetime.datetime.fromtimestamp(ts, MSK)
                vs = r.session_viewers(f"{r.ROOM_ID}*{st:%Y-%m-%dT%H:%M:00}")
                print("VIEWERS16", [(v.get("username"), str(v.get("url"))[-25:], round(r.watched_minutes(v), 1)) for v in vs])
                r._chat_cache.clear()
                ch = r.session_chat(st)
                print("CHAT16", len(ch), [(m["name"], m["text"][:40]) for m in ch[:8]])
            except Exception:
                traceback.print_exc()
            PY
            J=$(journalctl -u bizon-slots --since '-120min' --no-pager | grep -oE 'GET /(resolve|due|visited)[^ ]*' | sed -E 's/client_id=[^&]+/c=*/; s/text=[^&]+/t=*/' | sort | uniq -c | tr -s ' ' | tr '\n' ';')
            B=$(journalctl -u bizon-tgbot --since '-120min' --no-pager | tail -2 | tr '\n' ' ' | cut -c1-200)
            echo "::notice::$(systemctl is-active bizon-slots bizon-tgbot | tr '\n' ' ') ¦ $(tr '\n' ' ' < /tmp/diag.txt | cut -c1-2500) ¦ $J ¦ bot: $B"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

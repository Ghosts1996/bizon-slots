name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            cd /opt/bizon-slots
            set -a; . ./.env; set +a
            venv/bin/python - <<'PY' > /tmp/diag.txt 2>&1
            import datetime, json, traceback
            from app.main import db, MSK
            from app import report as r
            try:
                con = db(); r.acl_tables(con)
                print("users", [(c[:4], role, a) for c, role, a in con.execute('select chat_id, role, alerts from tg_users')])
                print("invites", con.execute('select count(*), sum(used_by is not null) from tg_invites').fetchone())
                print("regs", con.execute('select count(*) from reg_log').fetchone()[0])
                con.commit()
                from app.main import session_viewers, watched_minutes
                vs = session_viewers("209601:avtoweb*2026-11-02T21:00:00")
                print("viewers21", len(vs))
                for v in vs[:6]:
                    print("V", {k: (str(v.get(k))[:90]) for k in ("url", "username", "view", "viewTill", "vi", "finished", "mob")}, "min=", round(watched_minutes(v),1))
                st = r.day_stats(datetime.datetime.now(MSK))
                print("today", {k: st[k] for k in ('reg','came','room')}, [(s['hour'], s['reg'], s['came'], s['room']) for s in st['slots']])
            except Exception:
                traceback.print_exc()
            PY
            J=$(journalctl -u bizon-slots --since '-120min' --no-pager | grep -oE 'GET /(resolve|due|visited)[^ ]*' | sed -E 's/client_id=[^&]+/c=*/; s/text=[^&]+/t=*/' | sort | uniq -c | tr -s ' ' | tr '\n' ';')
            B=$(journalctl -u bizon-tgbot --since '-120min' --no-pager | tail -2 | tr '\n' ' ' | cut -c1-200)
            echo "::notice::$(systemctl is-active bizon-slots bizon-tgbot | tr '\n' ' ') ¦ $(tr '\n' ' ' < /tmp/diag.txt | cut -c1-2500) ¦ $J ¦ bot: $B"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

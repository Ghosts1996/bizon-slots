name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            B=https://online.bizon365.ru/api/v1
            q() { curl -sS --max-time 20 -H "X-Token: $BIZON_TOKEN" "$B/$1"; }
            sp=$(q webinars/subpages/getSubpages)
            echo "::notice::subpages: $(echo "$sp" | python3 -c 'import sys,json
            d=json.load(sys.stdin)
            for p in d.get("pages",d.get("list",[])) if isinstance(d,dict) else d:
                print({k:p.get(k) for k in ("name","title","pageId","id","url","webinarId","room")}, end=" | ")' 2>&1 | cut -c1-900)"
            echo "::notice::subpages raw: $(echo "$sp" | cut -c1-600)"
            wl=$(q "webinars/reports/getlist?skip=0&limit=5")
            echo "::notice::reports: $(echo "$wl" | cut -c1-700)"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

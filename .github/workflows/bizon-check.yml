name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            cd /opt/bizon-slots
            set -a; . ./.env; set +a
            venv/bin/python - <<'PY' > /tmp/diag.txt 2>&1
            import datetime, json, traceback
            from app.main import db, MSK
            from app import report as r
            try:
                import time as T
                y = datetime.datetime(2026, 11, 3, 12, tzinfo=MSK)
                orig = r.bizon_get
                calls = []
                def timed(path, params):
                    t0 = T.time()
                    try:
                        return orig(path, params)
                    finally:
                        calls.append((path.split("/")[-1], round(T.time() - t0, 1)))
                r.bizon_get = timed
                import app.main as M; M.bizon_get = timed
                t0 = T.time(); st = r.day_stats(y); print("DAY", round(T.time() - t0, 1))
                t0 = T.time(); txt = r.render_chat(y, st); print("CHAT", round(T.time() - t0, 1), len(txt))
                print("CALLS", calls)
                u = r.tg("getUpdates", timeout=0, limit=10).get("result", [])
                print("PENDING", [(x.get("message") or x.get("callback_query", {})).get("data") or (x.get("message") or {}).get("text") for x in u])
            except Exception:
                traceback.print_exc()
            PY
            J=$(journalctl -u bizon-slots --since '-120min' --no-pager | grep -oE 'GET /(resolve|due|visited)[^ ]*' | sed -E 's/client_id=[^&]+/c=*/; s/text=[^&]+/t=*/' | sort | uniq -c | tr -s ' ' | tr '\n' ';')
            B=$(journalctl -u bizon-tgbot --since '-60min' --no-pager | grep -v 'systemd\[1\]: Started' | tail -25 | tr '\n' ' ' | cut -c1-2500); P=$(ps aux | grep -c '[a]pp.report serve')
            echo "::notice::$(systemctl is-active bizon-slots bizon-tgbot | tr '\n' ' ') ¦ $(tr '\n' ' ' < /tmp/diag.txt | cut -c1-2500) ¦ $J ¦ procs=$P bot: $B"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            cd /opt/bizon-slots
            set -a; . ./.env; set +a
            venv/bin/python - <<'PY' > /tmp/diag.txt 2>&1
            import datetime, json, traceback
            from app.main import db, MSK
            from app import report as r
            try:
                from app.main import bizon_get
                for wid in ["209601:avtoweb*2026-11-02T21:00:00", "209601:avtoweb*2026-11-03T14:00:00"]:
                    try:
                        d = bizon_get("webinars/reports/get", {"webinarId": wid})
                    except Exception as e:
                        print(wid[-8:], "ERR", str(e)[:120]); continue
                    rep = d.get("report") or {}
                    print(wid[-8:], "top", list(d.keys()), "rep", list(rep.keys()) if isinstance(rep, dict) else type(rep).__name__)
                    if isinstance(rep, dict):
                        for k, v in rep.items():
                            print(" K", k, type(v).__name__, str(v)[:400].replace("\n", " "))
            except Exception:
                traceback.print_exc()
            PY
            J=$(journalctl -u bizon-slots --since '-120min' --no-pager | grep -oE 'GET /(resolve|due|visited)[^ ]*' | sed -E 's/client_id=[^&]+/c=*/; s/text=[^&]+/t=*/' | sort | uniq -c | tr -s ' ' | tr '\n' ';')
            B=$(journalctl -u bizon-tgbot --since '-120min' --no-pager | tail -2 | tr '\n' ' ' | cut -c1-200)
            echo "::notice::$(systemctl is-active bizon-slots bizon-tgbot | tr '\n' ' ') ¦ $(tr '\n' ' ' < /tmp/diag.txt | cut -c1-2500) ¦ $J ¦ bot: $B"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

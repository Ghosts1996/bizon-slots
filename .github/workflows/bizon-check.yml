name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            echo "::notice::dns $(getent ahosts api.telegram.org | awk '{print $1}' | sort -u | tr '\n' ' ')"
            echo "::notice::v4 $(curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}s' --max-time 15 https://api.telegram.org/ 2>&1 | tail -1)"
            echo "::notice::v6 $(curl -6 -sS -o /dev/null -w '%{http_code}' --max-time 10 https://api.telegram.org/ 2>&1 | tail -1)"
            echo "::notice::ip4 $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve api.telegram.org:443:149.154.167.220 https://api.telegram.org/ 2>&1 | tail -1)"
            echo "::notice::google $(curl -4 -sS -o /dev/null -w '%{http_code}' --max-time 10 https://www.google.com/ 2>&1 | tail -1)"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            B=https://online.bizon365.ru/api/v1
            t() { r=$(curl -sS --max-time 20 "$@" 2>&1 | cut -c1-160); echo "::notice::$1 $2 => $r"; }
            t -H "X-Token: $BIZON_TOKEN" "$B/webinars/subpages/getSubpages"
            t -H "Authorization: Bearer $BIZON_TOKEN" "$B/webinars/subpages/getSubpages"
            t -G --data-urlencode "token=$BIZON_TOKEN" "$B/webinars/subpages/getSubpages"
            t -H "X-Token: $BIZON_TOKEN" "https://start.bizon365.ru/api/v1/webinars/subpages/getSubpages"
            t -H "X-Token: $BIZON_TOKEN" "$B/webinars/reports/getlist?limit=3"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}

name: bizon-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          password: ${{ secrets.VDS_PASSWORD }}
          envs: BIZON_TOKEN
          script: |
            echo "::notice::token len=${#BIZON_TOKEN} hash=$(printf %s "$BIZON_TOKEN" | sha256sum | cut -c1-8)"
            L=http://127.0.0.1:8088
            echo "::notice::health $(curl -sS $L/health) $(date '+%H:%M %Z')"
            python3 - <<'PY'
            import sqlite3, datetime
            con = sqlite3.connect('/opt/bizon-slots/data.db')
            tz = datetime.timezone(datetime.timedelta(hours=3))
            f = lambda t: datetime.datetime.fromtimestamp(t, tz).strftime('%d.%m %H:%M')
            for cid, ts, reg in con.execute('select client_id, ts, reg_at from reg'):
                print(f"::notice::reg client={cid[:4]}*** slot={f(ts)} registered={f(reg)}")
            for cid, ts, step in con.execute('select client_id, ts, step from sent'):
                print(f"::notice::sent client={cid[:4]}*** slot={f(ts)} step={step}")
            PY
            echo "::notice::journal $(journalctl -u bizon-slots --since '-3h' --no-pager | grep -E 'GET /(resolve|due|visited)' | tail -8 | sed -E 's/client_id=[^& ]+/client_id=***/g' | tr '\n' ' ' | cut -c1-900)"
        env:
          BIZON_TOKEN: ${{ secrets.BIZON_TOKEN }}
